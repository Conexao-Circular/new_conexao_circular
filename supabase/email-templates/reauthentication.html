<!-- Supabase "Reauthentication" template. Paste into Dashboard >
     Authentication > Emails > Reauthentication > Message body,
     and set Subject heading to: Seu código de confirmação — Conexão Circular

     Only {{ .Token }} is available here (no confirmation link for this flow). -->
<!DOCTYPE html>
<html lang="pt-BR">
  <body style="margin:0; padding:0; background-color:#e2d5c6; font-family:Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#e2d5c6; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#fffaf5; border-radius:16px; overflow:hidden;">
            <tr>
              <td style="background-color:#364437; padding:28px 32px; text-align:center;">
                <img src="{{ .SiteURL }}/icons/icon-192.png" width="48" height="48" alt="Conexão Circular" style="border-radius:12px; display:inline-block;" />
                <div style="color:#e2d5c6; font-size:18px; font-weight:600; margin-top:10px;">
                  Conexão Circular
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:32px; text-align:center;">
                <h1 style="margin:0 0 12px; color:#364437; font-size:22px; font-weight:600;">
                  Confirme que é você
                </h1>
                <p style="margin:0 0 24px; color:#364437; font-size:14px; line-height:1.6;">
                  Para continuar com essa ação sensível na sua conta, digite o
                  código abaixo:
                </p>
                <div style="display:inline-block; padding:14px 28px; background-color:#e2d5c6; border-radius:10px; font-size:28px; font-weight:700; letter-spacing:6px; color:#364437;">
                  {{ .Token }}
                </div>
                <p style="margin:24px 0 0; color:#6b6b6b; font-size:12px; line-height:1.6;">
                  Se você não pediu esse código, ignore este e-mail e considere
                  trocar sua senha por segurança.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
