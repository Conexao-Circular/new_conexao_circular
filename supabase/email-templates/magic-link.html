<!-- Supabase "Magic Link" template. Paste into Dashboard >
     Authentication > Emails > Magic link or OTP > Message body,
     and set Subject heading to: Seu link de acesso — Conexão Circular

     Supabase variables used: {{ .SiteURL }} {{ .ConfirmationURL }} {{ .Token }} -->
<!DOCTYPE html>
<html lang="pt-BR">
  <body style="margin:0; padding:0; background-color:#e2d5c6; font-family:Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#e2d5c6; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#fffaf5; border-radius:16px; overflow:hidden;">
            <tr>
              <td style="background-color:#364437; padding:28px 32px; text-align:center;">
                <img src="{{ .SiteURL }}/icons/icon-192.png" width="48" height="48" alt="Conexão Circular" style="border-radius:12px; display:inline-block;" />
                <div style="color:#e2d5c6; font-size:18px; font-weight:600; margin-top:10px;">
                  Conexão Circular
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 12px; color:#364437; font-size:22px; font-weight:600;">
                  Seu link de acesso
                </h1>
                <p style="margin:0 0 20px; color:#364437; font-size:14px; line-height:1.6;">
                  Clique no botão abaixo para entrar na sua conta da Conexão Circular.
                  Este link expira em breve e só funciona uma vez.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:10px; background-color:#c87247;">
                      <a href="{{ .ConfirmationURL }}"
                         style="display:inline-block; padding:12px 28px; color:#fffaf5; font-size:14px; font-weight:600; text-decoration:none; border-radius:10px;">
                        Entrar na minha conta
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0; color:#364437; font-size:13px; line-height:1.6;">
                  Prefere digitar um código? Use: <strong>{{ .Token }}</strong>
                </p>
                <p style="margin:16px 0 0; color:#6b6b6b; font-size:12px; line-height:1.6;">
                  Se você não pediu este acesso, pode ignorar este e-mail com
                  segurança.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
