<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Você está offline · Conexão Circular</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: #fbf7f2;
        color: #364437;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .mark {
        width: 72px;
        height: 72px;
        color: #364437;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0.5rem 0 0;
      }
      p {
        margin: 0;
        max-width: 28ch;
        color: #5b6b5c;
        line-height: 1.5;
      }
      button {
        margin-top: 0.5rem;
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.5rem;
        background: #364437;
        color: #fbf7f2;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <svg class="mark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M 41.720 11.155 A 23 23 0 1 1 22.280 11.155" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" fill="none" />
      <path d="M 42.649 39.456 A 13 13 0 1 1 42.649 24.544" stroke="currentColor" stroke-width="9" fill="none" />
      <circle cx="32" cy="9" r="4.5" stroke="currentColor" stroke-width="4" />
      <circle cx="9.5" cy="45" r="3.5" stroke="currentColor" stroke-width="3" />
      <circle cx="54.5" cy="45" r="3.5" stroke="currentColor" stroke-width="3" />
    </svg>
    <h1>Você está offline</h1>
    <p>Sem conexão no momento. Assim que a internet voltar, seu app continua de onde parou.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </body>
</html>
